[pytest]
pythonpath = .
testpaths = tests
asyncio_mode = auto
; test_engine (conftest.py) is session-scoped and holds asyncpg connections
; that are bound to whichever event loop created them; pytest-asyncio's default
; per-test loop would make later tests hand that engine a connection from a
; loop it wasn't created on. Sharing one loop for the whole run avoids that
; mismatch. Per-test DB isolation still comes from db_conn's rollback, not
; from loop isolation, so this is safe.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
markers =
    integration: needs a reachable Postgres (see tests/conftest.py for how it's located)
